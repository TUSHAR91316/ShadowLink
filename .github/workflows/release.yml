name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # Builds every artifact without publishing a release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'
  JAVA_VERSION: '17'
  # gomobile's minimum Android API level for the generated AAR.
  ANDROID_API: '21'

jobs:
  # ─── Same gate as every PR: nothing ships unless CI is green ──────────────
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ─── Headless daemon binaries ─────────────────────────────────────────────
  build-headless:
    name: Daemon (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          # Names match the dev-fallback paths in shadowlink_gui/lib/services/daemon_service.dart.
          - { goos: windows, goarch: amd64, name: shadowlink-windows-x64.exe }
          - { goos: windows, goarch: arm64, name: shadowlink-windows-arm64.exe }
          - { goos: linux, goarch: amd64, name: shadowlink-linux-x64 }
          - { goos: linux, goarch: arm64, name: shadowlink-linux-arm64 }
          - { goos: darwin, goarch: amd64, name: shadowlink-macos-intel }
          - { goos: darwin, goarch: arm64, name: shadowlink-macos-apple-silicon }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.name }}" ./cmd/shadowlink

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  # ─── Windows desktop GUI (daemon bundled next to the executable) ──────────
  build-gui-windows:
    name: GUI (Windows)
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Flutter app
        working-directory: shadowlink_gui
        run: |
          flutter pub get
          flutter build windows --release

      # DaemonService looks for shadowlink.exe beside the GUI executable first.
      - name: Bundle daemon
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o shadowlink_gui/build/windows/x64/runner/Release/shadowlink.exe ./cmd/shadowlink

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path shadowlink_gui/build/windows/x64/runner/Release/* -DestinationPath dist/shadowlink-gui-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: dist/shadowlink-gui-windows-x64.zip
          if-no-files-found: error

  # ─── Linux desktop GUI (daemon bundled next to the executable) ────────────
  build-gui-linux:
    name: GUI (Linux)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Flutter app
        working-directory: shadowlink_gui
        run: |
          flutter pub get
          flutter build linux --release

      - name: Bundle daemon
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o shadowlink_gui/build/linux/x64/release/bundle/shadowlink ./cmd/shadowlink

      - name: Package
        run: |
          mkdir -p dist
          tar -C shadowlink_gui/build/linux/x64/release/bundle -czf dist/shadowlink-gui-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: dist/shadowlink-gui-linux-x64.tar.gz
          if-no-files-found: error

  # ─── Android APK (Go engine embedded via gomobile) ────────────────────────
  build-gui-android:
    name: GUI (Android)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Installed from inside the module so the versions pinned in go.mod are used.
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"

      - name: Build Android AAR
        run: |
          gomobile init
          mkdir -p shadowlink_gui/android/app/libs
          gomobile bind -v -target=android -androidapi "${ANDROID_API}" -o shadowlink_gui/android/app/libs/mobile.aar ./mobile

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build APK
        working-directory: shadowlink_gui
        run: |
          flutter pub get
          flutter build apk --release

      - name: Stage APK
        run: |
          mkdir -p dist
          cp shadowlink_gui/build/app/outputs/flutter-apk/app-release.apk dist/shadowlink-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gui-android
          path: dist/shadowlink-android.apk
          if-no-files-found: error

  # ─── iOS app (unsigned; Go engine embedded via gomobile) ──────────────────
  build-gui-ios:
    name: GUI (iOS, unsigned)
    needs: ci
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind

      - name: Build iOS XCFramework
        run: |
          gomobile init
          gomobile bind -v -target=ios,iossimulator -o shadowlink_gui/ios/Mobile.xcframework ./mobile

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Embed XCFramework in Xcode project
        run: |
          gem install xcodeproj --no-document
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('shadowlink_gui/ios/Runner.xcodeproj')
          target = project.targets.first
          framework_group = project.main_group.find_subpath('Frameworks', true)
          file_ref = framework_group.new_reference('Mobile.xcframework')
          target.frameworks_build_phase.add_file_reference(file_ref, true)

          embed_phase = target.build_phases.find { |p|
            p.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && p.name == 'Embed Frameworks'
          }
          if embed_phase.nil?
            embed_phase = project.new(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase)
            embed_phase.name = 'Embed Frameworks'
            embed_phase.symbol_dst_subfolder_spec = :frameworks
            target.build_phases << embed_phase
          end
          build_file = embed_phase.add_file_reference(file_ref, true)
          build_file.settings = { 'ATTRIBUTES' => ['CodeSignOnCopy', 'RemoveHeadersOnCopy'] }
          project.save
          "

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build iOS app (no codesign)
        working-directory: shadowlink_gui
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p dist Payload
          cp -R shadowlink_gui/build/ios/iphoneos/Runner.app Payload/
          zip -qr dist/shadowlink-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: gui-ios
          path: dist/shadowlink-ios-unsigned.ipa
          if-no-files-found: error

  # ─── Publish GitHub Release (tag pushes only) ─────────────────────────────
  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-headless, build-gui-windows, build-gui-linux, build-gui-android, build-gui-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Tags like v2.1.0-beta.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
