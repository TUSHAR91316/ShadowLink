name: Build and Release ShadowLink v2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# ─── Shared version pins ────────────────────────────────────────────────────
env:
  GO_VERSION: '1.22'
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'zulu'
  RUBY_VERSION: '3.0'

jobs:
  # ─── Go tests ─────────────────────────────────────────────────────────────
  test-go:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Tests
        run: go test ./... -count=1

  # ─── Headless binaries ────────────────────────────────────────────────────
  build-headless:
    name: Build Go Headless Binaries
    runs-on: ubuntu-latest
    needs: test-go
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Windows Headless
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o release/shadowlink-windows-x64.exe ./cmd/shadowlink

      - name: Build macOS Headless (Intel)
        env:
          GOOS: darwin
          GOARCH: amd64
        run: go build -o release/shadowlink-macos-intel ./cmd/shadowlink

      - name: Build macOS Headless (Apple Silicon)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build -o release/shadowlink-macos-apple-silicon ./cmd/shadowlink

      - name: Build Linux Headless
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o release/shadowlink-linux-x64 ./cmd/shadowlink

      - name: Upload Headless Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: headless-binaries
          path: release/shadowlink-*

  # ─── Windows GUI ──────────────────────────────────────────────────────────
  build-gui-windows:
    name: Build Flutter GUI (Windows)
    runs-on: windows-latest
    needs: test-go
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install dependencies
        working-directory: ./shadowlink_gui
        run: flutter pub get

      - name: Build Windows App
        working-directory: ./shadowlink_gui
        run: flutter build windows --release

      - name: Package Windows GUI
        run: |
          Compress-Archive -Path shadowlink_gui/build/windows/x64/runner/Release/* -DestinationPath release/shadowlink-gui-windows-x64.zip

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: release/shadowlink-gui-windows-x64.zip

  # ─── Android APK ──────────────────────────────────────────────────────────
  build-gui-android:
    name: Build Flutter GUI (Android)
    runs-on: ubuntu-latest
    needs: test-go
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}



      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Android AAR (gomobile)
        run: |
          mkdir -p shadowlink_gui/android/app/libs
          gomobile bind -v -target=android -androidapi 21 -o shadowlink_gui/android/app/libs/mobile.aar ./mobile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install dependencies
        working-directory: ./shadowlink_gui
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./shadowlink_gui
        run: flutter build apk --release

      - name: Stage APK
        run: |
          mkdir -p release
          cp shadowlink_gui/build/app/outputs/flutter-apk/app-release.apk release/shadowlink-android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-android
          path: release/shadowlink-android.apk

  # ─── iOS IPA ──────────────────────────────────────────────────────────────
  build-gui-ios:
    name: Build Flutter GUI (iOS)
    runs-on: macos-latest
    needs: test-go
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build iOS XCFramework (gomobile)
        run: |
          gomobile bind -v -target=ios,iossimulator -o shadowlink_gui/ios/Mobile.xcframework ./mobile

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Embed XCFramework in Xcode Project
        run: |
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project_path = 'shadowlink_gui/ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.first
          framework_group = project.main_group.find_subpath('Frameworks', true)
          file_ref = framework_group.new_reference('Mobile.xcframework')

          # Add to Frameworks Build Phase
          target.frameworks_build_phase.add_file_reference(file_ref, true)

          # Add to Embed Frameworks Build Phase
          embed_phase = target.build_phases.find { |p|
            p.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && p.name == 'Embed Frameworks'
          }
          if embed_phase.nil?
            embed_phase = project.new(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase)
            embed_phase.name = 'Embed Frameworks'
            embed_phase.symbol_dst_subfolder_spec = :frameworks
            target.build_phases << embed_phase
          end
          build_file = embed_phase.add_file_reference(file_ref, true)
          build_file.settings = { 'ATTRIBUTES' => ['CodeSignOnCopy', 'RemoveHeadersOnCopy'] }

          project.save
          "

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install dependencies
        working-directory: ./shadowlink_gui
        run: flutter pub get

      - name: Build iOS App (no codesign)
        working-directory: ./shadowlink_gui
        run: flutter build ios --release --no-codesign

      - name: Package iOS IPA
        run: |
          mkdir -p release
          cd shadowlink_gui/build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r ../../../../release/shadowlink-ios.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-ios
          path: release/shadowlink-ios.ipa

  # ─── GitHub Release ───────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-headless, build-gui-windows, build-gui-android, build-gui-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
